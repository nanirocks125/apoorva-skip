name: CI / SonarCloud Code Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test, and Analyze
    runs-on: macos-15 # Uses Apple Silicon M1/M2 runners with latest Xcode pre-installed

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones must be disabled for a meaningful SonarCloud analysis

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Run Tests and Generate Coverage
        env:
          SKIP_ACTION: none
        run: |
            cd libraries/ApoorvaUtilities/
            xcodebuild test \
              -scheme ApoorvaUtilities \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
              -enableCodeCoverage YES \
              -resultBundlePath TestResults

      - name: Convert Coverage to Generic XML
        run: |
          # Download official SonarSource conversion script
          curl -LO https://raw.githubusercontent.com/SonarSource/sonar-scanning-examples/master/swift-coverage/swift-coverage-example/xccov-to-sonarqube-generic.sh
          chmod +x xccov-to-sonarqube-generic.sh
          
          # Convert the xcodebuild .xcresult bundle to generic XML
          ./xccov-to-sonarqube-generic.sh libraries/ApoorvaUtilities/TestResults.xcresult > sonarqube-generic-coverage.xml
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: sonarqube-generic-coverage.xml
  sonarcloud-analysis:
    name: SonarCloud Scan
    needs: build-and-test # Wait for build to finish
    runs-on: ubuntu-latest # Linux runner supports the container action
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=nanirocks125_apoorva-skip
            -Dsonar.organization=manikanta-nandam
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*Tests.swift,**/*Test.swift
            -Dsonar.coverageReportPaths=sonarqube-generic-coverage.xml
            -Dsonar.c.compiler=/usr/bin/clang
