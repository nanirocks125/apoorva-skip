name: CI / SonarCloud Code Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Add this permissions block:
permissions:
  pull-requests: write # Allows SonarCloud to post PR comments
  contents: read       # Required to checkout the code

jobs:
  detect-modules:
    name: Detect Testable Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Find Modules with Tests
        id: set-modules
        run: |
          MODULES=()
          for dir in libraries/*; do
            # Check if it is a directory, contains a Package.swift, AND has a Tests folder[cite: 33]
            if [ -d "$dir" ] && [ -f "$dir/Package.swift" ] && [ -d "$dir/Tests" ]; then
              MODULES+=("\"$(basename "$dir")\"")
            fi
          done
          # Format as a JSON array for the matrix
          JSON="[$(IFS=,; echo "${MODULES[*]}")]"
          echo "modules=$JSON" >> $GITHUB_OUTPUT

  build-and-test:
    name: Test ${{ matrix.module }}
    needs: detect-modules
    runs-on: macos-15 # Uses Apple Silicon M1/M2 runners with latest Xcode pre-installed
    strategy:
          fail-fast: false # Prevents one module's failure from cancelling the others
          matrix:
            module: ${{ fromJson(needs.detect-modules.outputs.modules) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones must be disabled for a meaningful SonarCloud analysis

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run Tests and Generate Coverage for All Modules
        env:
          SKIP_ACTION: none
        run: |
          # Force CoreSimulator to initialize and cache available devices to prevent random missing simulator errors
          xcrun simctl list devices available > /dev/null

          # Download official SonarSource conversion script
          curl --proto '=https' --tlsv1.2 -LO https://raw.githubusercontent.com/SonarSource/sonar-scanning-examples/master/swift-coverage/swift-coverage-example/xccov-to-sonarqube-generic.sh
          chmod +x xccov-to-sonarqube-generic.sh
          
          # Create a directory to hold all individual coverage XMLs
          mkdir -p coverage-reports

          echo "Running tests for ${{ matrix.module }}..."
          
          # Run xcodebuild for the specific module[cite: 33]
                    (
                      cd libraries/${{ matrix.module }}
                      xcodebuild test \
                        -scheme "${{ matrix.module }}" \
                        -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
                        -skipPackagePluginValidation \
                        -skipMacroValidation \
                        -enableCodeCoverage YES \
                        -resultBundlePath "TestResults.xcresult"
                    )
              
              # Convert the xcodebuild .xcresult bundle to generic XML
            ./xccov-to-sonarqube-generic.sh libraries/${{ matrix.module }}/TestResults.xcresult > "coverage-reports/${{ matrix.module }}-coverage.xml"

            # Strip absolute macOS paths so Ubuntu SonarScanner can read them
          sed -i '' "s|$(pwd)/||g" "coverage-reports/${{ matrix.module }}-coverage.xml"

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: coverage-reports/*.xml

  sonarcloud-analysis:
    name: SonarCloud Scan
    needs: build-and-test # Wait for build to finish
    runs-on: ubuntu-latest # Linux runner supports the container action
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports
          pattern: coverage-* # Downloads all artifacts matching this pattern
          merge-multiple: true # Flattens them into the coverage-reports directory

      - name: Prepare Coverage Paths
        id: coverage
        run: |
          # Finds all XML files and joins them into a comma-separated string
          PATHS=$(ls coverage-reports/*-coverage.xml | paste -sd "," -)
          echo "paths=$PATHS" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=nanirocks125_apoorva-skip
            -Dsonar.organization=manikanta-nandam
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*Tests.swift,**/*Test.swift
            -Dsonar.exclusions=**/.skip/**,**/Skip/**,**/*.kt,**/build/**
            -Dsonar.coverageReportPaths=${{ steps.coverage.outputs.paths }}
            -Dsonar.c.compiler=/usr/bin/clang